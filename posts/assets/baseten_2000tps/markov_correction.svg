<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="title desc">
<title id="title">The Markov correction for one draft position</title><desc id="desc">For each candidate vocabulary token, the kernel takes the dot product of that candidate's projection vector and the previous token's embedding. It adds the result to the position's base logit, producing a corrected logit for sampling.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#263644}.head{font-size:13px;font-weight:700;fill:#536879}.label{font-size:13px;font-weight:600}.small{font-size:12px;fill:#536879}.sym{font-size:19px;font-weight:600;text-anchor:middle}.eq{font-size:15px;text-anchor:middle;font-weight:600}.cell{fill:#e3f0ef;stroke:#a7cac8}.emb{fill:#dce9f5;stroke:#aabfd4}.result{fill:#fff4df;stroke:#e2c994}.tag{fill:#fff;stroke:#cedbe5}</style>
<rect x="8" y="8" width="744" height="370" rx="14" fill="#f8fafb" stroke="#dce4ea"/>
<text class="head" x="27" y="36">CORRECT THE LOGITS FOR ONE DRAFT POSITION</text>
<text class="label" x="27" y="69">Previous token’s embedding</text><text class="small" x="27" y="88">e(previous token), length 256</text>

<rect class="emb" x="230" y="60" width="22" height="30" rx="3"/>
<rect class="emb" x="255" y="60" width="22" height="30" rx="3"/>
<rect class="emb" x="280" y="60" width="22" height="30" rx="3"/>
<rect class="emb" x="305" y="60" width="22" height="30" rx="3"/>
<rect class="emb" x="330" y="60" width="22" height="30" rx="3"/>
<rect class="emb" x="355" y="60" width="22" height="30" rx="3"/>
<rect class="emb" x="380" y="60" width="22" height="30" rx="3"/>
<rect class="emb" x="405" y="60" width="22" height="30" rx="3"/>
<text class="sym" x="445" y="82">···</text><text class="small" x="474" y="80">256 values</text>
<text class="head" x="27" y="131">FOR EACH POSSIBLE NEXT TOKEN</text>
<rect class="tag" x="27" y="151" width="64" height="36" rx="7"/><text class="eq" x="59" y="175">v₁</text>
<rect class="cell" x="111" y="155" width="18" height="28" rx="2"/>
<rect class="cell" x="131" y="155" width="18" height="28" rx="2"/>
<rect class="cell" x="151" y="155" width="18" height="28" rx="2"/>
<rect class="cell" x="171" y="155" width="18" height="28" rx="2"/>
<rect class="cell" x="191" y="155" width="18" height="28" rx="2"/>
<text class="sym" x="223" y="176">···</text><text class="sym" x="253" y="176">·</text>
<rect class="emb" x="270" y="155" width="16" height="28" rx="2"/>
<rect class="emb" x="288" y="155" width="16" height="28" rx="2"/>
<rect class="emb" x="306" y="155" width="16" height="28" rx="2"/>
<text class="sym" x="335" y="176">···</text><text class="sym" x="365" y="176">+</text><rect class="tag" x="384" y="151" width="76" height="36" rx="7"/><text class="eq" x="422" y="175">b(v₁)</text><text class="sym" x="481" y="176">=</text><rect class="result" x="502" y="151" width="83" height="36" rx="7"/><text class="eq" x="543" y="175">ℓ(v₁)</text>
<rect class="tag" x="27" y="200" width="64" height="36" rx="7"/><text class="eq" x="59" y="224">v₂</text>
<rect class="cell" x="111" y="204" width="18" height="28" rx="2"/>
<rect class="cell" x="131" y="204" width="18" height="28" rx="2"/>
<rect class="cell" x="151" y="204" width="18" height="28" rx="2"/>
<rect class="cell" x="171" y="204" width="18" height="28" rx="2"/>
<rect class="cell" x="191" y="204" width="18" height="28" rx="2"/>
<text class="sym" x="223" y="225">···</text><text class="sym" x="253" y="225">·</text>
<rect class="emb" x="270" y="204" width="16" height="28" rx="2"/>
<rect class="emb" x="288" y="204" width="16" height="28" rx="2"/>
<rect class="emb" x="306" y="204" width="16" height="28" rx="2"/>
<text class="sym" x="335" y="225">···</text><text class="sym" x="365" y="225">+</text><rect class="tag" x="384" y="200" width="76" height="36" rx="7"/><text class="eq" x="422" y="224">b(v₂)</text><text class="sym" x="481" y="225">=</text><rect class="result" x="502" y="200" width="83" height="36" rx="7"/><text class="eq" x="543" y="224">ℓ(v₂)</text>
<rect class="tag" x="27" y="249" width="64" height="36" rx="7"/><text class="eq" x="59" y="273">v₃</text>
<rect class="cell" x="111" y="253" width="18" height="28" rx="2"/>
<rect class="cell" x="131" y="253" width="18" height="28" rx="2"/>
<rect class="cell" x="151" y="253" width="18" height="28" rx="2"/>
<rect class="cell" x="171" y="253" width="18" height="28" rx="2"/>
<rect class="cell" x="191" y="253" width="18" height="28" rx="2"/>
<text class="sym" x="223" y="274">···</text><text class="sym" x="253" y="274">·</text>
<rect class="emb" x="270" y="253" width="16" height="28" rx="2"/>
<rect class="emb" x="288" y="253" width="16" height="28" rx="2"/>
<rect class="emb" x="306" y="253" width="16" height="28" rx="2"/>
<text class="sym" x="335" y="274">···</text><text class="sym" x="365" y="274">+</text><rect class="tag" x="384" y="249" width="76" height="36" rx="7"/><text class="eq" x="422" y="273">b(v₃)</text><text class="sym" x="481" y="274">=</text><rect class="result" x="502" y="249" width="83" height="36" rx="7"/><text class="eq" x="543" y="273">ℓ(v₃)</text>
<text class="small" x="112" y="314">projection vector Mᵥ</text><text class="small" x="273" y="314">embedding e</text><text class="small" x="387" y="314">base logit</text><text class="small" x="502" y="314">corrected logit</text>
<text class="small" x="27" y="352">Each dot product uses all 256 values. The same calculation applies across the vocabulary.</text></svg>