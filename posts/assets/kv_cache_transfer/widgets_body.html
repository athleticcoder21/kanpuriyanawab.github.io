<script>
/* Interactive figures for posts/kv_cache_transfer.qmd. Plain JS + inline SVG, no dependencies.
   Every number below is copied from the experiment result files (results/<pair>/*.json in the kv_transfer repo). */
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const C = { big: "#2a78d6", xfer: "#eb6834", small: "#1baf7a", ink: "#1b1b1a", ink2: "#52514e",
              muted: "#8a8984", grid: "#eeede9", rule: "#e4e2dc", none: "#e9e7e2", surface: "#fcfcfb" };

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "style") e.style.cssText = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    kids.flat().forEach(c => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }
  function sv(tag, attrs, ...kids) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) {
      if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    kids.flat().forEach(c => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }
  const tip = el("div", { class: "kt-tip", role: "tooltip" });
  document.body.append(tip);
  function showTip(ev, html) {
    tip.innerHTML = html; tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 12;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  function hideTip() { tip.style.display = "none"; }
  function hover(node, html) {
    node.addEventListener("mousemove", ev => showTip(ev, typeof html === "function" ? html() : html));
    node.addEventListener("mouseleave", hideTip);
  }
  function tabs(slot, names, onSel) {
    const bar = el("div", { class: "kt-tabs", role: "tablist" });
    const btns = names.map((n, i) => el("button", { class: "kt-tab", role: "tab", type: "button", onclick: () => sel(i) }, n));
    bar.append(...btns); slot.append(bar);
    function sel(i) { btns.forEach((b, j) => { b.classList.toggle("on", i === j); b.setAttribute("aria-selected", i === j); }); onSel(i); }
    return sel;
  }
  const pct = (x, ref) => Math.round(100 * x / ref);
  const f3 = x => x.toFixed(3);
  function legend(items) {
    return el("div", { class: "kt-legend" }, items.map(([c, t, shape]) =>
      el("span", {}, el("i", { class: "kt-sw", style: `background:${c};${shape === "round" ? "border-radius:50%" : ""}` }), t)));
  }
  function table(head, rows, opts) {
    opts = opts || {};
    const t = el("table", { class: "kt-table" });
    t.append(el("thead", {}, el("tr", {}, head.map((h, i) => el("th", { class: i && opts.num !== false ? "num" : "" }, h)))));
    const tb = el("tbody");
    rows.forEach(r => {
      const tr = el("tr", { class: r.hl ? "hl" : "" });
      (r.cells || r).forEach((c, i) => tr.append(el("td", { class: i && opts.num !== false ? "num" : "", html: String(c) })));
      tb.append(tr);
    });
    t.append(tb);
    return el("div", { class: "kt-scroll" }, t);
  }

  // Setup toggles on every figure
  document.querySelectorAll(".kt-fig").forEach(fig => {
    const btn = fig.querySelector(".kt-setup-btn"), panel = fig.querySelector(".kt-setup");
    if (!btn || !panel) return;
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", () => {
      const open = panel.classList.toggle("open");
      btn.setAttribute("aria-expanded", open);
    });
  });

  // Switch between the ridge recipe's algorithm and code panels.
  ["ridge", "distill"].forEach(prefix => {
    const recipe = document.getElementById(prefix + "-recipe");
    if (!recipe) return;
    const buttons = [...recipe.querySelectorAll('[role="tab"]')];
    function selectTab(active) {
      const diagram = document.getElementById(prefix + "-diagram");
      if (diagram) diagram.hidden = active.id === prefix + "-code-tab";
      buttons.forEach(button => {
        const selected = button === active;
        button.classList.toggle("on", selected);
        button.setAttribute("aria-selected", String(selected));
        button.tabIndex = selected ? 0 : -1;
        document.getElementById(button.getAttribute("aria-controls")).hidden = !selected;
      });
    }
    buttons.forEach((button, i) => {
      button.addEventListener("click", () => selectTab(button));
      button.addEventListener("keydown", event => {
        if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
        event.preventDefault();
        const next = buttons[(i + (event.key === "ArrowRight" ? 1 : -1) + buttons.length) % buttons.length];
        selectTab(next); next.focus();
      });
    });
  });

  /* ------------------------------------------------------------------ method diagram */
  (function method() {
    const root = document.getElementById("kt-method");
    if (!root) return;
    const W = 860, H = 300;
    const s = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "kt-svg", role: "img",
      "aria-label": "Small model prefills the prompt, a per-layer mapper turns its states into the big model's KV cache, the big model decodes." });
    const body = root.querySelector(".kt-body");
    let mode = 0;
    body.append(s);
    function box(x, y, w, h, fill, stroke) { return sv("rect", { x, y, width: w, height: h, rx: 8, fill, stroke, "stroke-width": 1.2 }); }
    function arrow(x1, y1, x2, y2, col, dash) {
      return sv("g", {}, sv("line", { x1, y1, x2, y2, stroke: col, "stroke-width": 1.8, "stroke-dasharray": dash || "" }),
        sv("path", { d: `M${x2} ${y2} l-7 -4 v8 z`, fill: col, transform: `rotate(${Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI} ${x2} ${y2})` }));
    }
    function draw() {
      s.innerHTML = "";
      // prompt tokens
      s.append(sv("text", { x: 20, y: 28, class: "kt-t-strong" }, "Prompt (thousands of tokens)"));
      for (let i = 0; i < 14; i++) s.append(sv("rect", { x: 20 + i * 15, y: 40, width: 12, height: 18, rx: 3, fill: C.none }));
      s.append(sv("text", { x: 20, y: 76 }, "documents, few-shot examples, a long codebase…"));
      // big model column (right)
      const bx = 560, by = 30, bw = 280, bh = 230;
      s.append(box(bx, by, bw, bh, "#fff", C.rule));
      s.append(sv("text", { x: bx + 14, y: by + 22, class: "kt-t-strong" }, "Big model (frozen)"));
      s.append(sv("text", { x: bx + 14, y: by + 40 }, "KV cache, one slab per layer"));
      const L = 8;
      for (let l = 0; l < L; l++) {
        const y = by + 56 + (L - 1 - l) * 18;
        s.append(sv("rect", { x: bx + 14, y, width: 150, height: 13, rx: 3, fill: mode ? C.xfer : C.big }));
        s.append(sv("text", { x: bx + 172, y: y + 11, "font-size": 11 }, l === 0 ? "layer 0" : l === L - 1 ? "layer L−1" : ""));
      }
      s.append(sv("text", { x: bx + 14, y: by + bh - 14, class: "kt-t-ink" }, "→ decodes the answer token by token"));
      if (!mode) {
        s.append(arrow(240, 49, bx - 6, 49, C.big));  // straight across, well above the label below it
        s.append(sv("text", { x: 290, y: 118, class: "kt-t-ink" }, "big model reads every prompt token"));
        s.append(sv("text", { x: 290, y: 134 }, "through every layer: the slow part"));
        s.append(sv("text", { x: 20, y: 200, class: "kt-t-strong" }, "Prefill cost ≈ big model × prompt length"));
        s.append(sv("text", { x: 20, y: 220 }, "at 128k tokens Qwen3.8-27B needs 19.9 s on one GPU (HF)"));
      } else {
        // small model
        const sx = 20, sy = 110, sw = 210, sh = 150;
        s.append(box(sx, sy, sw, sh, "#fff", C.rule));
        s.append(sv("text", { x: sx + 12, y: sy + 22, class: "kt-t-strong" }, "Small model (frozen)"));
        s.append(sv("text", { x: sx + 12, y: sy + 40 }, "reads the prompt, keeps its"));
        s.append(sv("text", { x: sx + 12, y: sy + 56 }, "per-layer K, V (or hidden states)"));
        for (let l = 0; l < 5; l++) s.append(sv("rect", { x: sx + 12, y: sy + 70 + (4 - l) * 14, width: 110, height: 10, rx: 3, fill: C.small }));
        s.append(arrow(70, 84, 70, sy - 4, C.ink2));
        // mapper
        const mx = 290, my = 130, mw = 210, mh = 130;
        s.append(box(mx, my, mw, mh, "#fff8f4", C.xfer));
        s.append(sv("text", { x: mx + 12, y: my + 22, class: "kt-t-strong" }, "Mapper (the only thing trained)"));
        s.append(sv("text", { x: mx + 12, y: my + 42 }, "for each big layer t:"));
        s.append(sv("text", { x: mx + 12, y: my + 60, class: "kt-t-ink", "font-family": "monospace" }, "Y_t = X_S(t) · (W₀ + A·B)"));
        s.append(sv("text", { x: mx + 12, y: my + 80 }, "X_S(t): states from 3 best-fit layers"));
        s.append(sv("text", { x: mx + 12, y: my + 98 }, "W₀: ridge fit, A·B: rank 64, KL"));
        s.append(sv("text", { x: mx + 12, y: my + 116 }, "then re-apply big-model RoPE"));
        s.append(arrow(sx + sw + 4, sy + 75, mx - 6, my + 60, C.ink2));
        s.append(arrow(mx + mw + 4, my + 60, bx - 6, 150, C.xfer));
        s.append(sv("text", { x: 290, y: 100, class: "kt-t-ink" }, "the small model reads the prompt;"));
        s.append(sv("text", { x: 290, y: 116 }, "the big model decodes from its mapped cache"));
      }
    }
    draw();
  })();

  /* ------------------------------------------------------------------ experiment 0: reproduction */
  (function repro() {
    const root = document.getElementById("kt-repro");
    if (!root) return;
    const body = root.querySelector(".kt-body");
    const views = [
      () => [legend([[C.big, "Qwen3-8B's own cache"], [C.xfer, "0.6B → mapped cache"], [C.muted, "no cache"]]),
        bars([["8B's own cache", 0.001, C.big, "top-1 0.987 · PPL 9.59"], ["no prefix at all", 0.725, C.muted, "top-1 0.686 · PPL 17.75"],
              ["ridge map only", 0.422, C.xfer, "top-1 0.733 · PPL 13.31"], ["ridge + rank-16 KL", 0.135, C.xfer, "top-1 0.842 · PPL 10.31"],
              ["ridge + rank-64 KL", 0.128, C.xfer, "best of the round-2 sweep"]], 0.8, "KL to teacher (lower is better)"),
        el("div", { class: "kt-note" }, "KL(teacher ‖ student) on a 128-token continuation after a 2,048-token prefix, 128 held-out fineweb-edu docs.")],
      () => [table(["prefilled by", "SQuAD F1 (300)", "HotpotQA F1 (300)", "GSM8K acc (400)"], [
        ["Qwen3-8B itself", "0.738", "0.603", "0.925"],
        { hl: 1, cells: ["0.6B → r64 mapper", "0.721 (98%)", "0.461 (76%)", "0.665 (72%)"] },
        ["0.6B → r64 + task post-training", "0.684 (93%)", "0.523 (87%)", "0.797 (86%)"],
        ["Qwen3-0.6B alone", "0.388", "0.029", "0.495"],
        ["8B, no context (closed book)", "0.248", "0.207", "–"]]),
        el("div", { class: "kt-note" }, "Post-training only helps the tasks it sees: holding GSM8K out of the task mix leaves GSM8K at 0.650.")],
      () => [table(["small model", "fidelity KL", "SQuAD transfer / alone", "HotpotQA transfer / alone", "GSM8K transfer / alone", "prefill speedup 8k / 32k"], [
        ["Qwen3-0.6B", "0.128", "0.721 / 0.388", "0.461 / 0.029", "0.665 / 0.495", "4.6× / 3.5×"],
        ["Qwen3-1.7B", "0.098", "0.746 / 0.639", "0.515 / 0.149", "0.757 / <b>0.815</b>", "3.2× / 2.7×"],
        ["Qwen3-4B", "0.054", "0.774 / 0.738", "0.595 / 0.542", "0.877 / <b>0.915</b>", "1.4× / 1.2×"]]),
        el("div", { class: "kt-note" }, "Big model is Qwen3-8B (0.738 / 0.603 / 0.925) in every row. Bold: the small model alone beats the transfer.")],
      () => [legend([[C.big, "exact half"], [C.xfer, "mapped half"]]),
        bars([["both mapped", 0.135, C.xfer, "rank-16 mapper"], ["exact K, mapped V", 0.134, C.xfer, "fixing keys changes nothing"],
              ["mapped K, exact V", 0.094, C.big, "fixing values closes ~30% of the gap"]], 0.2, "KL to teacher (lower is better)"),
        el("div", { class: "kt-note" }, "For this pair the values are the bottleneck. OneTriangle report the opposite (keys matter more) on their pairs.")],
      () => [table(["", "round 3 (first machine)", "round 4 (rerun)"], [
        ["ridge fidelity KL", "0.422", "0.442"],
        ["r64 fidelity KL, same command", "0.128", "0.129"],
        ["r64 SQuAD / HotpotQA / GSM8K", "0.721 / 0.461 / 0.665", "0.704 / 0.467 / 0.623"],
        ["8B exact SQuAD / HotpotQA / GSM8K", "0.738 / 0.603 / 0.925", "0.743 / 0.610 / 0.927"]]),
        el("div", { class: "kt-note" }, "Fidelity reproduces exactly; task scores move ±0.02–0.04 between independent training runs (GSM8K SE ≈ 0.024).")],
    ];
    function bars(rows, max, axis) {
      const g = el("div", { class: "kt-bars", style: "grid-template-columns:150px 1fr 260px" });
      rows.forEach(([lab, v, col, note]) => {
        const tr = el("div", { class: "kt-track" }, el("div", { class: "kt-fill", style: `width:${100 * v / max}%;background:${col}` }));
        g.append(el("div", { class: "lab" }, lab), tr, el("div", { class: "val" }, `${f3(v)} · ${note}`));
      });
      return el("div", {}, el("div", { class: "kt-sub" }, axis), g);
    }
    tabs(root.querySelector(".kt-tabs-slot"), ["Fidelity", "Tasks", "Small-model size", "Keys vs values", "Rerun"], i => {
      body.innerHTML = ""; body.append(...views[i]());
    })(0);
  })();

  /* ------------------------------------------------------------------ layer plans (shared) */
  function plan(spec, L) {
    const [base, flag] = spec.split("/"); const [name, arg] = base.split(":");
    const R = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
    const k = +arg;
    const T = { all: () => R(0, L), first: () => R(0, k), last: () => R(L - k, L),
      every: () => R(0, L).filter(l => l % k === k - 1), keep: () => R(0, L).filter(l => l % k !== k - 1),
      range: () => { const [a, b] = arg.split("-").map(Number); return R(a, b); } }[name]();
    const S = new Set(T), blocks = [];
    let l = 0;
    while (l < L) { if (S.has(l)) { const a = l; while (l < L && S.has(l)) l++; if (l < L) blocks.push([a, l]); } else l++; }
    return { S, blocks, delta: flag !== "nodelta", n: T.length };
  }
  function strip(svg, spec, L, opts) {
    opts = opts || {};
    const W = 860, x0 = 92, x1 = W - 20, cw = (x1 - x0) / L, y = opts.y || 24, h = 30;
    const p = plan(spec, L);
    svg.append(sv("text", { x: 0, y: y + 19, class: "kt-t-ink", "font-size": 12 }, opts.label || "layers"));
    for (let l = 0; l < L; l++) {
      const isT = p.S.has(l), att = opts.attn && opts.attn(l);
      const r = sv("rect", { x: x0 + l * cw + 1, y, width: cw - 2, height: h, rx: Math.min(3, cw / 4), fill: isT ? C.xfer : C.big });
      svg.append(r);
      if (att) svg.append(sv("path", { d: `M${x0 + l * cw + cw / 2 - 4} ${y - 4} h8 l-4 -6 z`, fill: C.ink }));
      const hit = sv("rect", { x: x0 + l * cw, y: y - 10, width: cw, height: h + 14, fill: "transparent" });
      hover(hit, () => opts.tipFor ? opts.tipFor(l, isT, att) :
        `<b>layer ${l}</b><br>${isT ? "transferred: K, V mapped from the small model" : "native: the big model computes this layer over the prompt"}`);
      svg.append(hit);
    }
    // residual Δ bridges
    p.blocks.forEach(([a, b]) => {
      const xa = x0 + a * cw + 2, xb = x0 + b * cw + cw / 2, yb = y + h + 6;
      svg.append(sv("path", { d: `M${xa} ${yb} v6 H${xb} v-6`, fill: "none", stroke: p.delta ? C.ink : C.muted,
        "stroke-width": 1.4, "stroke-dasharray": p.delta ? "" : "3 3" }));
      if (b - a >= 2 || p.blocks.length < 6)
        svg.append(sv("text", { x: (xa + xb) / 2, y: yb + 20, "text-anchor": "middle", "font-size": 11, fill: p.delta ? C.ink : C.muted }, p.delta ? "Δ" : "no Δ"));
    });
    svg.append(sv("text", { x: x0, y: y + h + 50, "font-size": 11 }, "layer 0 (bottom)"));
    svg.append(sv("text", { x: x1, y: y + h + 50, "font-size": 11, "text-anchor": "end" }, `layer ${L - 1} (top)`));
    return p;
  }

  /* ------------------------------------------------------------------ experiment 1: partial-layer transfer */
  (function plans() {
    const root = document.getElementById("kt-plans");
    if (!root) return;
    const EX = { squad: 0.743, hotpot: 0.610, gsm: 0.927 }, ALONE = { squad: 0.381, hotpot: 0.029, gsm: 0.482 };
    // spec, KL ridge, KL r64, SQuAD, HotpotQA, GSM8K, speedup 8k, speedup 32k
    const D = [
      ["all", .442, .136, .690, .454, .640, 3.76, 3.58], ["last:33", .425, .134, .643, .415, .623, 2.91, 2.76],
      ["last:30", .397, .130, .668, .447, .637, 2.36, 2.26], ["last:27", .371, .125, .667, .453, .660, 2.01, 1.97],
      ["last:24", .328, .113, .684, .492, .635, 1.75, 1.67], ["last:21", .281, .102, .676, .460, .708, 1.55, 1.48],
      ["last:18", .231, .079, .675, .506, .812, 1.35, 1.34], ["last:15", .178, .055, .693, .510, .870, 1.23, 1.20],
      ["last:12", .120, .037, .696, .542, .900, 1.14, 1.09], ["last:9", .074, .021, .729, .578, .912, 1.04, 1.02],
      ["last:6", .048, .014, .742, .603, .922, 0.97, 0.94], ["first:27", .383, .133, .706, .446, .635, 2.11, 2.11],
      ["first:18", .422, .135, .610, .430, .117, 1.44, 1.44], ["keep:4", .442, .144, .688, .432, .650, 1.93, 1.91],
      ["keep:2", .501, .138, .671, .419, .545, 1.29, 1.30], ["every:2", .348, .107, .654, .496, .805, 1.31, 1.31],
      ["range:9-27", .293, .116, .697, .457, .682, 1.39, 1.41], ["keep:4/nodelta", .973, .233, .398, .357, .490, 2.05, 2.03],
      ["every:2/nodelta", .675, .212, .412, .329, .430, 1.34, 1.35]].map(r => ({ spec: r[0], klr: r[1], kl: r[2], squad: r[3], hotpot: r[4], gsm: r[5], s8: r[6], s32: r[7] }));
    const by = Object.fromEntries(D.map(d => [d.spec, d]));
    const groups = [["top N", ["all", "last:33", "last:30", "last:27", "last:24", "last:21", "last:18", "last:15", "last:12", "last:9", "last:6"]],
                    ["bottom N", ["first:27", "first:18"]], ["interleaved", ["every:2", "keep:2", "keep:4", "range:9-27"]],
                    ["no Δ", ["every:2/nodelta", "keep:4/nodelta"]]];
    const body = root.querySelector(".kt-body");
    let cur = "last:18", metric = "gsm";
    const chips = el("div", { class: "kt-chips" });
    const chipBtns = {};
    groups.forEach(([g, specs]) => {
      const cg = el("div", { class: "kt-chipgroup" }, el("i", {}, g));
      specs.forEach(s => { const b = el("button", { class: "kt-chip", type: "button", onclick: () => select(s) }, s); chipBtns[s] = b; cg.append(b); });
      chips.append(cg);
    });
    const stripSvg = sv("svg", { viewBox: "0 0 860 122", class: "kt-svg" });
    const stats = el("div", { class: "kt-stats" });
    const barsBox = el("div", { class: "kt-bars" });
    const scatterHead = el("div", { class: "kt-row", style: "justify-content:space-between;align-items:flex-end;margin-top:18px" });
    const scatterTabsSlot = el("div");
    scatterHead.append(el("div", { class: "kt-sub", style: "margin:0" }, "Every trained plan: prefill speedup vs quality"), scatterTabsSlot);
    const sc = sv("svg", { viewBox: "0 0 860 330", class: "kt-svg" });
    body.append(chips, legend([[C.big, "native: Qwen3-8B computes the layer over the prompt"], [C.xfer, "transferred: K, V mapped from Qwen3-0.6B"]]),
      stripSvg, stats, barsBox, scatterHead, sc);

    function select(s) {
      cur = s;
      Object.entries(chipBtns).forEach(([k, b]) => b.classList.toggle("on", k === s));
      const d = by[s];
      stripSvg.innerHTML = "";
      const p = strip(stripSvg, s, 36, { label: "Qwen3-8B" });
      stats.innerHTML = "";
      [["prefill speedup", `${d.s8.toFixed(2)}×`, `at 8k tokens · ${d.s32.toFixed(2)}× at 32k`],
       ["layers the 8B still runs", `${36 - p.n} / 36`, `${p.n} transferred${p.delta ? "" : ", residual skipped"}`],
       ["fidelity KL", f3(d.kl), `ridge init ${f3(d.klr)} → trained`]].forEach(([k, v, s2]) =>
        stats.append(el("div", { class: "kt-stat" }, el("div", { class: "k" }, k), el("div", { class: "v" }, v), el("div", { class: "s" }, s2))));
      barsBox.innerHTML = "";
      [["SQuAD", "squad"], ["HotpotQA", "hotpot"], ["GSM8K", "gsm"]].forEach(([lab, key]) => {
        const v = d[key], p100 = 100 * v / EX[key];
        const tr = el("div", { class: "kt-track" },

  })();

  /* ------------------------------------------------------------------ experiment 5: token alignment */
  (function align() {
    const root = document.getElementById("kt-align");
    if (!root) return;
    // Real tokenizations (HF tokenizers, offsets) of the sentence below.
    const TEXT = "The Kilimanjaro expedition costs $12,450 and takes approximately seven days.";
    const QW = [["The",0,3],[" Kil",3,7],["iman",7,11],["j",11,12],["aro",12,15],[" expedition",15,26],[" costs",26,32],[" $",32,34],["1",34,35],["2",35,36],[",",36,37],["4",37,38],["5",38,39],["0",39,40],[" and",40,44],[" takes",44,50],[" approximately",50,64],[" seven",64,70],[" days",70,75],[".",75,76]];
    const GE = [["The",0,3],[" Kilim",3,9],["anj",9,12],["aro",12,15],[" expedition",15,26],[" costs",26,32],[" $",32,34],["1",34,35],["2",35,36],[",",36,37],["4",37,38],["5",38,39],["0",39,40],[" and",40,44],[" takes",44,50],[" approximately",50,64],[" seven",64,70],[" days",70,75],[".",75,76]];
    const body = root.querySelector(".kt-body");
    const box = el("div", { class: "kt-align" }), note = el("div", { class: "kt-note" });
    body.append(box, note);
    function render(dir) {
      const big = dir ? QW : GE, small = dir ? GE : QW;
      const bigName = dir ? "Qwen3-14B (big)" : "Gemma3-12B (big)", smallName = dir ? "Gemma3-4B (small)" : "Qwen3-4B (small)";
      const off = 7, K = 1.4; // ch offset for the <bos> chip; ch per character (room for borders)
      const X = c => `${(off + c * K).toFixed(2)}ch`, Wd = n => `${(n * K).toFixed(2)}ch`;
      box.innerHTML = "";
      const inner = el("div", { class: "inner", style: `width:${off + TEXT.length * K + 1}ch` });
      inner.append(el("div", { class: "kt-rowlab", style: "top:2px" }, bigName + " tokens"), el("div", { class: "kt-rowlab", style: "top:134px" }, smallName + " tokens"));
      const smallEls = small.map(([t, a, b]) => { const e = el("div", { class: "kt-tok small", style: `left:${X(a)};width:${Wd(b - a)}` }, t); inner.append(e); return e; });
      const owner = c => small.findIndex(([, a, b]) => c >= a && c < b);
      // big <bos> (Gemma always has one; Qwen3 has none)
      if (!dir) {
        const bos = el("div", { class: "kt-tok big", style: `left:0ch;width:6ch;border-style:dashed` }, "<bos>");
        hover(bos, "<b>&lt;bos&gt;</b>: the attention-sink position. Its K, V are taken exactly from the big model (a one-token prefill), never mapped.");
        inner.append(bos);
      }
      big.forEach(([t, a, b], i) => {
        const j = owner(b - 1);
        const e = el("div", { class: "kt-tok big", style: `left:${X(a)};width:${Wd(b - a)}` }, t);
        const link = el("div", { class: "kt-link", style: `left:${X(b - 0.5)}` });
        inner.append(link, e);
        const on = () => { inner.querySelectorAll(".kt-tok").forEach(x => x.classList.add("dim")); e.classList.remove("dim"); e.classList.add("hot");
          smallEls[j].classList.remove("dim"); smallEls[j].classList.add("hot"); link.classList.add("hot");
          note.innerHTML = `Big token <b>${JSON.stringify(t)}</b> (characters ${a}–${b}) ends inside small token <b>${JSON.stringify(small[j][0])}</b>, so it reads that position's small-model states, plus its own big-model token embedding.`; };
        const off_ = () => { inner.querySelectorAll(".kt-tok").forEach(x => x.classList.remove("dim", "hot")); link.classList.remove("hot"); idle(); };
        e.addEventListener("mouseenter", on); e.addEventListener("mouseleave", off_);
      });
      box.append(inner);
      function idle() { note.innerHTML = "Hover a big-model token. Each one reads the small-model position whose token covers its <b>last character</b>: the whole prompt is known at prefill time, so peeking at a later small token inside the same span leaks nothing."; }
      idle();
    }
    tabs(root.querySelector(".kt-tabs-slot"), ["Qwen3-4B → Gemma3-12B", "Gemma3-4B → Qwen3-14B"], render)(0);
