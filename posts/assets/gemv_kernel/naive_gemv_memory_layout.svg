<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Row-major matrix indexing</title><desc id="desc">A three by four logical matrix A stored row by row as one linear array.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5 0 10z" fill="#334e68"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#102a43}.l{font:700 20px system-ui,sans-serif;fill:#102a43}.s{font:400 17px system-ui,sans-serif;fill:#52606d}.c{font:600 18px system-ui,sans-serif;fill:#102a43;text-anchor:middle}.i{font:500 14px system-ui,sans-serif;fill:#52606d;text-anchor:middle}.r{font:600 15px system-ui,sans-serif;fill:#486581;text-anchor:end}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="70" y="60" class="h">How a 2D matrix becomes a linear array</text><text x="70" y="92" class="s">Example: A has M = 3 rows and N = 4 columns. CUDA stores its elements row by row.</text>
  <text x="375" y="155" class="l" text-anchor="middle">Logical matrix A</text><text x="235" y="208" class="i">column</text><g class="i"><text x="303" y="208">0</text><text x="393" y="208">1</text><text x="483" y="208">2</text><text x="573" y="208">3</text></g><g class="r"><text x="235" y="275">row 0</text><text x="235" y="365">row 1</text><text x="235" y="455">row 2</text></g>
  <g stroke-width="1.8"><g fill="#dbeafe" stroke="#2563eb"><rect x="258" y="220" width="90" height="90"/><rect x="348" y="220" width="90" height="90"/><rect x="438" y="220" width="90" height="90"/><rect x="528" y="220" width="90" height="90"/></g><g fill="#dcfce7" stroke="#16a34a"><rect x="258" y="310" width="90" height="90"/><rect x="348" y="310" width="90" height="90"/><rect x="438" y="310" width="90" height="90"/><rect x="528" y="310" width="90" height="90"/></g><g fill="#ffedd5" stroke="#ea580c"><rect x="258" y="400" width="90" height="90"/><rect x="348" y="400" width="90" height="90"/><rect x="438" y="400" width="90" height="90"/><rect x="528" y="400" width="90" height="90"/></g></g>
  <g class="c"><text x="303" y="274">A[0,0]</text><text x="393" y="274">A[0,1]</text><text x="483" y="274">A[0,2]</text><text x="573" y="274">A[0,3]</text><text x="303" y="364">A[1,0]</text><text x="393" y="364">A[1,1]</text><text x="483" y="364">A[1,2]</text><text x="573" y="364">A[1,3]</text><text x="303" y="454">A[2,0]</text><text x="393" y="454">A[2,1]</text><text x="483" y="454">A[2,2]</text><text x="573" y="454">A[2,3]</text></g><path d="M438 515V570" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="690" y="155" class="l">Linear storage of A in memory (row-major)</text><text x="690" y="183" class="s">offset = row × N + column</text><g stroke-width="1.8"><g fill="#dbeafe" stroke="#2563eb"><rect x="690" y="230" width="100" height="85"/><rect x="790" y="230" width="100" height="85"/><rect x="890" y="230" width="100" height="85"/><rect x="990" y="230" width="100" height="85"/></g><g fill="#dcfce7" stroke="#16a34a"><rect x="690" y="315" width="100" height="85"/><rect x="790" y="315" width="100" height="85"/><rect x="890" y="315" width="100" height="85"/><rect x="990" y="315" width="100" height="85"/></g><g fill="#ffedd5" stroke="#ea580c"><rect x="690" y="400" width="100" height="85"/><rect x="790" y="400" width="100" height="85"/><rect x="890" y="400" width="100" height="85"/><rect x="990" y="400" width="100" height="85"/></g></g>
  <g class="c"><text x="740" y="280">A[0,0]</text><text x="840" y="280">A[0,1]</text><text x="940" y="280">A[0,2]</text><text x="1040" y="280">A[0,3]</text><text x="740" y="365">A[1,0]</text><text x="840" y="365">A[1,1]</text><text x="940" y="365">A[1,2]</text><text x="1040" y="365">A[1,3]</text><text x="740" y="450">A[2,0]</text><text x="840" y="450">A[2,1]</text><text x="940" y="450">A[2,2]</text><text x="1040" y="450">A[2,3]</text></g><g class="i"><text x="740" y="307">0</text><text x="840" y="307">1</text><text x="940" y="307">2</text><text x="1040" y="307">3</text><text x="740" y="392">4</text><text x="840" y="392">5</text><text x="940" y="392">6</text><text x="1040" y="392">7</text><text x="740" y="477">8</text><text x="840" y="477">9</text><text x="940" y="477">10</text><text x="1040" y="477">11</text></g><text x="890" y="532" class="s" text-anchor="middle">The first N values are row 0; the next N are row 1; and so on.</text>
  <rect x="140" y="580" width="920" height="45" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="600" y="609" class="l" text-anchor="middle">A[row, column]  →  A[row × N + column]</text>
</svg>
