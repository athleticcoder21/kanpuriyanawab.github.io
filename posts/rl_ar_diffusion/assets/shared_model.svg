<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 561" role="img" aria-labelledby="title desc">
<title id="title">Shared transformer, different attention and decoding</title><desc id="desc">AR and diffusion select different attention patterns but use the same token embeddings, transformer blocks and vocabulary projection. AR picks one next token; diffusion fills masked positions over multiple passes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="760" height="561" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="380" y="28" text-anchor="middle" font-size="21" fill="#282828" font-weight="600">One model, two decoding modes</text><rect x="30" y="55" width="320" height="68" rx="12" fill="#edf4fd" stroke="#2a78d6"/><text x="190" y="83" text-anchor="middle" font-size="18" fill="#2a78d6" font-weight="600">AR mode</text><text x="190" y="107" text-anchor="middle" font-size="15" fill="#626975" font-weight="400">Causal attention</text><rect x="410" y="55" width="320" height="68" rx="12" fill="#fff2eb" stroke="#eb6834"/><text x="570" y="83" text-anchor="middle" font-size="18" fill="#eb6834" font-weight="600">Diffusion mode</text><text x="570" y="107" text-anchor="middle" font-size="15" fill="#626975" font-weight="400">Attention within a block</text><path d="M190 123 V145 H350 V173" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 123 V145 H410 V173" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="174" width="400" height="253" rx="12" fill="#f7f8fa" stroke="#dce0e5"/><text x="380" y="201" text-anchor="middle" font-size="13" fill="#626975" font-weight="600">SHARED WEIGHTS</text><rect x="210" y="215" width="340" height="56" rx="12" fill="#ffffff" stroke="#dce0e5"/><text x="380" y="238" text-anchor="middle" font-size="17" fill="#282828" font-weight="600">Token embeddings</text><text x="380" y="259" text-anchor="middle" font-size="14" fill="#626975" font-weight="400">Token IDs → vectors</text><path d="M380 271 V280" fill="none" stroke="#626975" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="281" width="340" height="56" rx="12" fill="#ffffff" stroke="#dce0e5"/><text x="380" y="304" text-anchor="middle" font-size="17" fill="#282828" font-weight="600">Transformer blocks</text><text x="380" y="325" text-anchor="middle" font-size="14" fill="#626975" font-weight="400">Attention + feed-forward layers</text><path d="M380 337 V346" fill="none" stroke="#626975" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="347" width="340" height="56" rx="12" fill="#ffffff" stroke="#dce0e5"/><text x="380" y="370" text-anchor="middle" font-size="17" fill="#282828" font-weight="600">Vocabulary projection</text><text x="380" y="391" text-anchor="middle" font-size="14" fill="#626975" font-weight="400">Hidden states → token scores</text><path d="M350 428 V450 H190 V475" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 428 V450 H570 V475" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="476" width="320" height="67" rx="12" fill="#edf4fd" stroke="#2a78d6"/><text x="190" y="504" text-anchor="middle" font-size="17" fill="#2a78d6" font-weight="600">Pick the next token</text><text x="190" y="528" text-anchor="middle" font-size="14" fill="#626975" font-weight="400">Repeat left to right</text><rect x="410" y="476" width="320" height="67" rx="12" fill="#fff2eb" stroke="#eb6834"/><text x="570" y="504" text-anchor="middle" font-size="17" fill="#eb6834" font-weight="600">Fill masked positions</text><text x="570" y="528" text-anchor="middle" font-size="14" fill="#626975" font-weight="400">Repeat until the block is complete</text></g></svg>
