<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-labelledby="title desc">
<title id="title">AR-only training and evaluation in both modes</title><desc id="desc">Export the original model in AR layout without changing weight values. GRPO updates the weights through AR training. Evaluate each trained checkpoint in vLLM for AR, and restore the original NVIDIA layout for diffusion evaluation in SGLang.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="760" height="419" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="380" y="28" text-anchor="middle" font-size="21" fill="#282828" font-weight="600">Train in AR mode, then test both modes</text><rect x="18" y="62" width="154" height="80" rx="12" fill="#f7f8fa" stroke="#dce0e5"/><text x="95" y="94" text-anchor="middle" font-size="16" fill="#282828" font-weight="600">Original model</text><text x="95" y="120" text-anchor="middle" font-size="13" fill="#626975" font-weight="400">NVIDIA layout</text><rect x="208" y="62" width="154" height="80" rx="12" fill="#edf4fd" stroke="#2a78d6"/><text x="285" y="94" text-anchor="middle" font-size="16" fill="#282828" font-weight="600">Export AR layout</text><text x="285" y="120" text-anchor="middle" font-size="13" fill="#626975" font-weight="400">Same weight values</text><rect x="398" y="62" width="154" height="80" rx="12" fill="#edf4fd" stroke="#2a78d6"/><text x="475" y="94" text-anchor="middle" font-size="16" fill="#282828" font-weight="600">AR-only GRPO</text><text x="475" y="120" text-anchor="middle" font-size="13" fill="#626975" font-weight="400">Updates the weights</text><rect x="588" y="62" width="154" height="80" rx="12" fill="#f7f8fa" stroke="#dce0e5"/><text x="665" y="94" text-anchor="middle" font-size="16" fill="#282828" font-weight="600">Checkpoint</text><text x="665" y="120" text-anchor="middle" font-size="13" fill="#626975" font-weight="400">Trained weights</text><path d="M172 102 H205" fill="none" stroke="#626975" stroke-width="2" marker-end="url(#arrow)"/><path d="M362 102 H395" fill="none" stroke="#626975" stroke-width="2" marker-end="url(#arrow)"/><path d="M552 102 H585" fill="none" stroke="#626975" stroke-width="2" marker-end="url(#arrow)"/><path d="M665 143 V181 H251 V250" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/><path d="M665 181 H574 V223" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arrow)"/><rect x="141" y="251" width="220" height="79" rx="12" fill="#edf4fd" stroke="#2a78d6"/><text x="251" y="282" text-anchor="middle" font-size="18" fill="#2a78d6" font-weight="600">AR evaluation</text><text x="251" y="309" text-anchor="middle" font-size="15" fill="#626975" font-weight="400">vLLM</text><rect x="464" y="224" width="220" height="65" rx="12" fill="#fff2eb" stroke="#eb6834"/><text x="574" y="251" text-anchor="middle" font-size="16" fill="#282828" font-weight="600">Restore NVIDIA layout</text><text x="574" y="274" text-anchor="middle" font-size="13" fill="#626975" font-weight="400">Same trained weight values</text><path d="M574 290 V316" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arrow)"/><rect x="464" y="317" width="220" height="79" rx="12" fill="#fff2eb" stroke="#eb6834"/><text x="574" y="348" text-anchor="middle" font-size="18" fill="#eb6834" font-weight="600">Diffusion evaluation</text><text x="574" y="375" text-anchor="middle" font-size="15" fill="#626975" font-weight="400">SGLang</text><text x="251" y="366" text-anchor="middle" font-size="14" fill="#626975" font-weight="400">Same test questions</text><text x="251" y="387" text-anchor="middle" font-size="14" fill="#626975" font-weight="400">at every checkpoint</text></g></svg>
