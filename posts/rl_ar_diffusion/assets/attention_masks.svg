<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 449" role="img" aria-labelledby="title desc">
<title id="title">Causal and block attention masks</title><desc id="desc">Rows are query positions; columns are positions they can attend to. Causal attention allows the diagonal and earlier positions. Diffusion additionally allows all positions inside the current block to attend to each other. Four prefix tokens and a four-position current block are shown.</desc>
